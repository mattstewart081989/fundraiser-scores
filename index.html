<script>
const SUPABASE_URL = "https://wafdruhsqrewxlazkyhr.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_DROshSZDOXW04SlzxDVCvQ_V457KHtC";

function ukToday() {
  return new Intl.DateTimeFormat("en-CA", {
    timeZone: "Europe/London",
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).format(new Date());
}

function prettyDate(dateStr) {
  return new Date(dateStr + "T12:00:00").toLocaleDateString("en-GB", {
    weekday: "short",
    day: "numeric",
    month: "short",
    year: "numeric"
  });
}

function cleanName(name) {
  return String(name || "")
    .replace(/\s+\d{3,6}$/, "")
    .trim();
}

function updateTimestamp() {
  document.getElementById("lastUpdated").textContent =
    "Updated: " + new Date().toLocaleString("en-GB", {
      timeZone: "Europe/London",
      weekday: "short",
      day: "numeric",
      month: "short",
      hour: "numeric",
      minute: "2-digit"
    }) + " BST";
}

async function loadScores() {
 const selectedDate = document.getElementById("datePicker").value || ukToday();
const range = document.getElementById("rangePicker").value;

document.getElementById("todayLabel").textContent = prettyDate(selectedDate);

let dateFilter = `report_date=eq.${selectedDate}`;

if (range !== "day") {
  const start = new Date(selectedDate + "T00:00:00");
  start.setDate(start.getDate() - (Number(range) - 1));
  const startDate = start.toISOString().slice(0, 10);

  dateFilter = `report_date=gte.${startDate}&report_date=lte.${selectedDate}`;
}

  const url =
     `${SUPABASE_URL}/rest/v1/fundraiser_scores?select=office,fundraiser,signups,created_at,report_date&${dateFilter}&order=signups.desc`;

  const res = await fetch(url, {
    headers: {
      apikey: SUPABASE_ANON_KEY,
      Authorization: "Bearer " + SUPABASE_ANON_KEY
    }
  });

  const formunautsRows = await res.json();

const evergivingUrl =
 `${SUPABASE_URL}/rest/v1/evergiving_scores?select=office,fundraiser,supporters,created_at,report_date&${dateFilter}`;

  console.log("Selected date:", selectedDate);
console.log("EverGiving URL:", evergivingUrl);

console.log("DASHBOARD CODE UPDATED");
  
const evergivingRes = await fetch(evergivingUrl, {
  headers: {
    apikey: SUPABASE_ANON_KEY,
    Authorization: "Bearer " + SUPABASE_ANON_KEY
  }
});

const evergivingRows = await evergivingRes.json();

console.log("EverGiving response:", evergivingRows);
console.log("EverGiving count:", evergivingRows.length);
  console.log("EverGiving total:", evergivingRows.reduce((sum, r) => sum + Number(r.supporters || 0), 0));
console.log("Formunauts total:", formunautsRows.reduce((sum, r) => sum + Number(r.signups || 0), 0));

function normaliseOffice(office) {
  return office === "River NW B" ? "River NW" : office;
}

const rows = [
  ...formunautsRows.map(row => ({
    ...row,
    office: normaliseOffice(row.office)
  })),
  ...evergivingRows.map(row => ({
    ...row,
    office: normaliseOffice(row.office),
    signups: Number(row.supporters || 0)
  }))
];

console.log("Combined count:", rows.length);
console.log("Combined total:", rows.reduce((sum, r) => sum + Number(r.signups || 0), 0));


  if (!Array.isArray(rows)) {
    console.error("Supabase error:", rows);
    render([]);
    return;
  }

const unique = {};


  
rows.forEach(row => {
  const office = row.office || "Unknown";
  const fundraiser = cleanName(row.fundraiser);

  const key = fundraiser;

  if (!unique[key]) {
    unique[key] = {
      office,
      fundraiser,
      signups: Number(row.signups || 0)
    };
  }
});

const data = Object.values(unique)
  .filter(row => row.signups > 0)
  .sort((a, b) => b.signups - a.signups || a.fundraiser.localeCompare(b.fundraiser));

render(data);

function render(data) {
  const total = data.reduce((sum, row) => sum + row.signups, 0);
 const top = data[0];

const latest = rows
  .filter(row => Number(row.signups || 0) > 0)
  .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];

document.getElementById("latestSignup").textContent =
  latest ? latest.fundraiser : "-";
  
document.getElementById("totalToday").textContent = total;
document.getElementById("activeFundraisers").textContent = data.length;

  
const first = data[0];
const second = data[1];
const third = data[2];

  

document.getElementById("firstName").textContent = first?.fundraiser || "-";
document.getElementById("firstScore").textContent = first?.signups || 0;

document.getElementById("secondName").textContent = second?.fundraiser || "-";
document.getElementById("secondScore").textContent = second?.signups || 0;

document.getElementById("thirdName").textContent = third?.fundraiser || "-";
document.getElementById("thirdScore").textContent = third?.signups || 0;




  const tbody = document.getElementById("leaderboardBody");
  tbody.innerHTML = "";

  if (!data.length) {
    tbody.innerHTML = '<tr><td colspan="4" class="empty">No sign-ups found for today yet.</td></tr>';
    return;
  }

  data.forEach((row, index) => {
  const tr = document.createElement("tr");

  if (index === 0) tr.classList.add("rank-1");
  if (index === 1) tr.classList.add("rank-2");
  if (index === 2) tr.classList.add("rank-3");

  tr.innerHTML = `
      <td class="rank">${index + 1}</td>
      <td class="name">${row.fundraiser}</td>
      <td>
  <span class="office-badge">${row.office}</span>
</td>
      <td class="right score">${row.signups}</td>
    `;
    tbody.appendChild(tr);
  });
}
        
}

document.addEventListener("DOMContentLoaded", async () => {
  updateTimestamp();
  await loadScores();
});

setTimeout(() => {
  const bee = document.getElementById("bee");
  const socials = document.querySelectorAll(".social-link");

  if (!bee || socials.length < 2) return;

  bee.style.animation = "none";

  const beeRect = bee.getBoundingClientRect();
  const instaRect = socials[0].getBoundingClientRect();
  const linkedinRect = socials[1].getBoundingClientRect();

  const instaX = instaRect.left - beeRect.left;
  const instaY = instaRect.top - beeRect.top;

  const linkedinX = linkedinRect.left - beeRect.left;
  const linkedinY = linkedinRect.top - beeRect.top;

  const flight = bee.animate(
    [
      { transform: "translate(0, 0)" },
      { transform: `translate(${instaX}px, ${instaY}px)`, offset: 0.25 },
      { transform: `translate(${instaX}px, ${instaY}px)`, offset: 0.55 },
      { transform: `translate(${linkedinX}px, ${linkedinY}px)`, offset: 0.7 },
      { transform: `translate(${linkedinX}px, ${linkedinY}px)`, offset: 0.85 },
      { transform: "translate(0, 0)" }
    ],
    {
      duration: 8000,
      easing: "ease-in-out"
    }
  );

  flight.onfinish = () => {
    bee.style.animation = "beeFly 3s ease-in-out infinite";
  };

}, 2500);
</script>
